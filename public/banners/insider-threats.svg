<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1a0e0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="105" x2="1200" y2="105" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="#1e293b" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="#1e293b" stroke-width="1"/>
  <!-- Orange threat nodes -->
  <circle cx="960" cy="180" r="40" fill="#f97316" opacity="0.06"/>
  <circle cx="960" cy="180" r="28" fill="#f97316" opacity="0.08"/>
  <circle cx="960" cy="180" r="16" fill="#f97316" opacity="0.15"/>
  <circle cx="1060" cy="380" r="30" fill="#ef4444" opacity="0.08"/>
  <circle cx="1060" cy="380" r="18" fill="#ef4444" opacity="0.12"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="614" width="1200" height="4" fill="url(#accent)" opacity="0.5"/>
  <!-- Category tag -->
  <rect x="60" y="60" width="230" height="32" rx="16" fill="#f97316" opacity="0.12"/>
  <text x="80" y="81" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#fb923c" letter-spacing="1">NATIONAL SECURITY</text>
  <!-- Title -->
  <text x="60" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="50" font-weight="800" fill="#ffffff">Insider Threats in AI</text>
  <text x="60" y="260" font-family="system-ui,-apple-system,sans-serif" font-size="50" font-weight="800" fill="#ffffff">Are a National Security Issue</text>
  <!-- Subtitle -->
  <text x="60" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="21" fill="#94a3b8">How AI insider threats have escalated into geopolitical risk in 2026</text>
  <!-- Author -->
  <text x="60" y="540" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#64748b">By</text>
  <text x="82" y="540" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#fb923c">Vex</text>
  <!-- Branding -->
  <text x="60" y="575" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#60a5fa">77 Security</text>
  <text x="170" y="575" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#475569"> · AI Security Research</text>
</svg>
