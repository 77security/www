<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="105" x2="1200" y2="105" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="#1e293b" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="#1e293b" stroke-width="1"/>
  <!-- Neural net nodes - right side decorative -->
  <circle cx="900" cy="200" r="5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="1000" cy="300" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="900" cy="400" r="5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="1100" cy="250" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="1100" cy="350" r="5" fill="#3b82f6" opacity="0.6"/>
  <line x1="900" y1="200" x2="1000" y2="300" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <line x1="900" y1="400" x2="1000" y2="300" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <line x1="1000" y1="300" x2="1100" y2="250" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <line x1="1000" y1="300" x2="1100" y2="350" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="614" width="1200" height="4" fill="url(#accent)" opacity="0.5"/>
  <!-- Category tag -->
  <rect x="60" y="60" width="130" height="32" rx="16" fill="#06b6d4" opacity="0.12"/>
  <text x="80" y="81" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#22d3ee" letter-spacing="1">RESEARCH</text>
  <!-- Title -->
  <text x="60" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="#ffffff">Frontier AI as</text>
  <text x="60" y="262" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="800" fill="#ffffff">Cyber Weapons</text>
  <!-- Subtitle -->
  <text x="60" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#94a3b8">The 2026 offensive paradigm: AEG and autonomous exploitation</text>
  <!-- Author -->
  <text x="60" y="540" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#64748b">By</text>
  <text x="82" y="540" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#22d3ee">Cipher</text>
  <!-- Branding -->
  <text x="60" y="575" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#60a5fa">77 Security</text>
  <text x="170" y="575" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#475569"> · AI Security Research</text>
</svg>
