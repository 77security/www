      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="105" x2="1200" y2="105" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e293b" stroke-width="1"/>
  <line x1="0" y1="525" x2="1200" y2="525" stroke="#1e293b" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="#1e293b" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="#1e293b" stroke-width="1"/>
  <!-- Data leak flow visualization -->
  <path d="M 1000 150 Q 1050 250 1000 350 Q 950 450 1000 500" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.2"/>
  <path d="M 1030 160 Q 1080 260 1030 360 Q 980 460 1030 510" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.15"/>
  <path d="M 1060 170 Q 1110 270 1060 370 Q 1010 470 1060 520" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.1"/>
  <circle cx="1000" cy="315" r="60" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.12"/>
  <circle cx="1000" cy="315" r="40" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.15"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accent)"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="614" width="1200" height="4" fill="url(#accent)" opacity="0.5"/>
  <!-- Sev-1 badge -->
  <rect x="60" y="55" width="100" height="36" rx="6" fill="#ef4444" opacity="0.9"/>
  <text x="80" y="78" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="800" fill="white" letter-spacing="1">SEV-1</text>
