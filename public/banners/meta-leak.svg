  <rect x="175" y="60" width="130" height="32" rx="16" fill="#06b6d4" opacity="0.12"/>
  <text x="195" y="81" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#22d3ee" letter-spacing="1">DEEP DIVE</text>
  <!-- Title -->
  <text x="60" y="205" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="800" fill="#ffffff">Meta AI Agent</text>
  <text x="60" y="265" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="800" fill="#22d3ee">'Internal Leak'</text>
  <text x="60" y="325" font-family="system-ui,-apple-system,sans-serif" font-size="48" font-weight="800" fill="#ffffff">&amp; the Sev-1 Crisis</text>
