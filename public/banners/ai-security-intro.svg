  <line x1="950" y1="200" x2="1050" y2="160" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <line x1="950" y1="200" x2="1050" y2="280" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
