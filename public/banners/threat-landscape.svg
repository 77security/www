  <line x1="480" y1="210" x2="720" y2="315" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
  <line x1="720" y1="315" x2="960" y2="210" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
